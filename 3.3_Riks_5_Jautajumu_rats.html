<!DOCTYPE html>
<html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jautājumu rats – 3.3. Mākslas piedzīvošana (3. klase)</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#f3ede4;font-family:Candara,"Segoe UI",Calibri,Arial,sans-serif;color:#1F4E79;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;background:#fffdf9;overflow:hidden;border:4px solid #2E74B5;border-radius:18px}
header{position:absolute;left:0;top:0;width:100%;height:92px;background:#2E74B5;color:#fff;display:flex;align-items:center;padding:0 32px;gap:26px}
header h1{font-size:38px;white-space:nowrap}
header p{font-size:25px;line-height:1.2;opacity:.97}
main{position:absolute;left:0;top:92px;width:100%;height:718px;padding:18px 28px}
footer{position:absolute;left:0;bottom:0;width:100%;height:90px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#f7efe6;border-top:3px solid #e6d8c7}
.fl{display:flex;gap:18px;align-items:center;font-size:27px;font-weight:bold}
button{font-family:inherit;cursor:pointer;border:none;border-radius:14px;font-size:27px;font-weight:bold;padding:14px 26px;min-height:62px;color:#fff;background:#C75000;box-shadow:0 4px 0 rgba(0,0,0,.18)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
button.blue{background:#2E74B5}
button.ghost{background:#fff;color:#1F4E79;border:3px solid #2E74B5}
button:disabled{opacity:.4;cursor:default}
#fs{background:#1F4E79;font-size:23px}
.msg{font-size:30px;font-weight:bold;min-height:44px}
.ok{color:#2a7d2e}.no{color:#C75000}
.pic{background-size:cover;background-position:center}
.shake{animation:sh .4s}
@keyframes sh{20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
.pop{animation:pp .35s}
@keyframes pp{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
/* ainas (scenes) */
.sc{position:relative;width:100%;height:100%;overflow:hidden;border-radius:12px}
.sc-muz{background:linear-gradient(#e7ded0 0 78%,#9b7a55 78% 100%)}
.sc-muz .bx{left:14%;top:5%;width:72%;height:66%}.sc-muz img{border:.55em solid #b8892b;outline:2px solid #7c5a17;box-shadow:6px 10px 16px rgba(0,0,0,.35)}
.sc-muz i{position:absolute;left:77%;top:52%;width:9%;height:9%;background:#fff;border:2px solid #999}
.sc-muz b{position:absolute;left:5%;right:5%;top:74%;height:3px;background:#b33;border-radius:2px}
.sc-mol{background:#dfe9f2}
.sc-mol .bx{left:20%;top:4%;width:60%;height:60%;z-index:2;align-items:flex-end}.sc-mol img{border:.2em solid #fff;box-shadow:3px 5px 10px rgba(0,0,0,.3)}
.sc-mol i,.sc-mol b,.sc-mol u{position:absolute;background:#8a5a2b;width:3.2%;top:4%;height:94%;left:48.4%}
.sc-mol i{transform:rotate(14deg);transform-origin:top}.sc-mol b{transform:rotate(-14deg);transform-origin:top}
.sc-mol s{position:absolute;left:22%;top:64%;width:56%;height:4.5%;background:#6e4520;z-index:3}
.sc-gra{background:#cfd8c4}
.sc-gra .pg{position:absolute;top:12%;height:76%;width:41%;background:#fff;box-shadow:0 6px 12px rgba(0,0,0,.3)}
.sc-gra .l{left:9%;border-radius:8px 0 0 8px;background:linear-gradient(90deg,#fff 85%,#ddd)}
.sc-gra .r{left:50%;border-radius:0 8px 8px 0;background:linear-gradient(90deg,#ddd,#fff 15%)}
.sc-gra .l i{display:block;height:5%;margin:9% 12% 0;background:#c9c9c9;border-radius:3px}
.sc-gra .r .bx{left:10%;top:8%;width:80%;height:64%}
.sc-gra .r i{position:absolute;left:14%;width:60%;top:76%;height:5%;background:#c9c9c9;border-radius:3px}
.sc-ekr{background:#e9e4f0}
.sc-ekr .scr{position:absolute;left:19%;top:9%;width:62%;height:66%;background:#222;border-radius:12px;padding:3.2%}
.sc-ekr .scr .bx{position:relative;width:100%;height:100%;background:#000}
.sc-ekr i{position:absolute;left:9%;top:75%;width:82%;height:9%;background:#b9b9c2;border-radius:0 0 18px 18px}
.sc-atk{background:#f1e3c8}
.sc-atk .cd{position:absolute;left:20%;top:12%;width:60%;height:72%;background:#fff;padding:3.5% 3.5% 0;transform:rotate(-5deg);box-shadow:5px 8px 14px rgba(0,0,0,.3)}
.sc-atk .cd .bx{position:relative;width:100%;height:78%}
.sc-atk .cd em{display:block;text-align:center;font-style:italic;font-size:.85em;color:#555;margin-top:2%}
.sc-pla{background:repeating-linear-gradient(0deg,#b9654a 0 22px,#a85840 22px 24px)}
.sc-pla .ps{position:absolute;left:28%;top:6%;width:44%;height:88%;background:#fff;padding:3%;box-shadow:4px 6px 12px rgba(0,0,0,.4)}
.sc-pla .ps .bx{position:relative;width:100%;height:64%}
.sc-pla .ps em{display:block;text-align:center;font-style:normal;font-weight:bold;color:#C75000;font-size:1.05em;margin-top:5%}
.sc-pla .ps small{display:block;text-align:center;color:#444;font-size:.6em}
.sc-ber{background:#e3eef7}
.sc-ber svg,.sc-ski svg{position:absolute;left:18%;top:8%;width:64%;height:84%;background:#fff;box-shadow:4px 6px 12px rgba(0,0,0,.3)}
.sc-ski{background:#ddd6c8}

.bx{position:absolute;display:flex;align-items:center;justify-content:center}
.bx img{display:block;max-width:100%;max-height:100%;width:auto;height:auto}
</style></head><body>
<div id="stage"><header><h1>Jautājumu rats</h1><p>Griez ratu! Atbildi uz jautājumu vai izpildi uzdevumu.</p></header>
<main><style>
#wl{position:absolute;left:24px;top:6px;width:700px;height:706px}
#ww{position:relative;width:660px;height:660px;margin:38px auto 0;filter:drop-shadow(0 8px 14px rgba(31,78,121,.35))}
#wh{width:660px;height:660px;display:block;transition:transform 4.2s cubic-bezier(.15,.85,.2,1)}
#wh text{font-family:Candara,"Segoe UI",Calibri,Arial,sans-serif}
#ar{position:absolute;left:50%;top:-34px;margin-left:-34px;border-left:34px solid transparent;border-right:34px solid transparent;border-top:64px solid #C75000;z-index:3;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
#hub{position:absolute;left:50%;top:50%;width:164px;height:164px;margin:-82px 0 0 -82px;border-radius:50%;border:8px solid #fff;background:#C75000;color:#fff;font-size:36px;padding:0;box-shadow:0 4px 10px rgba(0,0,0,.35);z-index:2}
#hub.off{background:#b9b9b9;pointer-events:none}
#qa{position:absolute;left:750px;top:10px;width:822px;height:698px}
.lbl{display:inline-block;color:#fff;font-size:26px;font-weight:bold;padding:4px 20px;border-radius:12px;margin-bottom:8px}
.qi{width:400px;height:270px;margin:0 auto 8px;font-size:20px}.qi .sc.pic{background-size:contain;background-repeat:no-repeat;background-color:#efe7da}
#qa h3{font-size:32px;text-align:center;margin-bottom:10px;line-height:1.2}
#qa button{display:block;width:100%;margin-bottom:10px;font-size:27px;text-align:left}
#qa .msg{font-size:26px;text-align:center;line-height:1.2}
.task{font-size:32px;line-height:1.4;text-align:center;background:#fdeee2;border:3px solid #C75000;border-radius:16px;padding:18px;margin-bottom:16px;color:#222}
.wait{font-size:38px;font-weight:bold;text-align:center;padding-top:230px;line-height:1.4}.wait small{font-size:27px;font-weight:normal}
</style>
<div id="wl"><div id="ww"><div id="ar"></div><svg id="wh" viewBox="0 0 600 600"></svg><button id="hub" onclick="spin()">GRIEZ!</button></div></div>
<div id="qa"></div>
</main>

function wheel(){var s='<defs>';Q.forEach(function(q,i){s+='<clipPath id="c'+i+'"><circle cx="0" cy="-238" r="38"/></clipPath>';});s+='</defs><circle cx="300" cy="300" r="298" fill="#fff"/>';
 Q.forEach(function(q,i){var a0=i*SEG,a1=(i+1)*SEG,p0=pt(284,a0),p1=pt(284,a1),done=left.indexOf(i)<0;
  s+='<path d="M300 300 L'+p0[0]+' '+p0[1]+' A284 284 0 0 1 '+p1[0]+' '+p1[1]+' Z" fill="'+(done?'#c9c9c9':(q.sp?'#3a2a3f':COL[i%COL.length]))+'" stroke="#fff" stroke-width="4"/>';
  s+='<g transform="translate(300 300) rotate('+(a0+SEG/2)+')" opacity="'+(done?.55:1)+'">';
  s+='<text transform="translate(7 -134) rotate(-90)" text-anchor="middle" font-size="21" font-weight="bold" fill="#fff"'+(q.l.length>9?' textLength="112" lengthAdjust="spacingAndGlyphs"':'')+'>'+q.l+'</text>';
  s+='<circle cx="0" cy="-238" r="42" fill="#fff"/>';
  if(done)s+='<text x="0" y="-222" text-anchor="middle" font-size="46" fill="#2a7d2e" font-weight="bold">✔</text>';
  else if(q.g)s+='<text x="0" y="-221" text-anchor="middle" font-size="50" fill="'+(q.g=='♥'?'#d22':'#1F4E79')+'">'+q.g+'</text>';
  else s+='<image href="'+IMG[q.tk]+'" x="-38" y="-276" width="76" height="76" preserveAspectRatio="xMidYMid slice" clip-path="url(#c'+i+')"/>';
  s+='</g>';});
 $('wh').innerHTML=s;}

 setTimeout(function(){busy=false;ask(i);},4300);}

function ask(i){cur=i;var q=Q[i];var h='<div class="lbl" style="background:'+(q.sp?'#3a2a3f':COL[i%COL.length])+'">'+q.l+'</div><div class="qi">'+qpic(q)+'</div><h3>'+q.q+'</h3>';

 else{shuffle(q.o.map(function(t,j){return [t,j];})).forEach(function(o){h+='<button class="blue" onclick="ans(this,'+o[1]+')">'+o[0]+'</button>';});h+='<div id="m" class="msg"></div>';}
